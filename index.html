<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shrinking Room</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- MAIN MENU -->
  <section id="screen-menu" class="screen active">
    <h1 class="game-title">SHRINKING<span>ROOM</span></h1>
    <p class="game-tagline">The walls are not patient.</p>
    <div class="menu-buttons">
      <button class="btn btn-primary" id="btn-play">Play</button>
      <button class="btn btn-secondary" id="btn-level-select">Level Select</button>
      <button class="btn btn-secondary" id="btn-settings">Settings</button>
    </div>
  </section>

  <!-- LEVEL SELECT -->
  <section id="screen-level-select" class="screen">
    <h2 class="screen-heading">Select a Room</h2>
    <div class="level-grid" id="level-grid"></div>
    <button class="btn btn-secondary" id="btn-back-from-levels">Back</button>
  </section>

  <!-- SETTINGS -->
  <section id="screen-settings" class="screen">
    <h2 class="screen-heading">Settings</h2>
    <div class="settings-block">
      <h3>Room Theme <span class="settings-hint">(unlocked by streaks)</span></h3>
      <div class="theme-swatches" id="theme-swatches"></div>
    </div>
    <button class="btn btn-secondary" id="btn-back-from-settings">Back</button>
  </section>

  <!-- GAME SCREEN -->
  <section id="screen-game" class="screen">
    <div id="hud">
      <div class="hud-item"><span class="hud-label">Room</span><span class="hud-value" id="hud-level">1</span></div>
      <div class="hud-item"><span class="hud-label">Time</span><span class="hud-value" id="hud-timer">00.0</span></div>
      <div class="hud-item"><span class="hud-label">Best</span><span class="hud-value" id="hud-best">--</span></div>
      <button class="hud-pause" id="btn-pause" type="button">❙❙</button>
    </div>

    <div class="stage-frame" id="stage-frame">
      <canvas id="game-canvas" width="600" height="600"></canvas>
      <div id="puzzle-layer"></div>
    </div>

    <p class="stage-hint" id="stage-hint"></p>
  </section>

  <!-- PAUSE OVERLAY -->
  <section id="screen-pause" class="screen overlay">
    <div class="overlay-card">
      <h2>Paused</h2>
      <button class="btn btn-primary" id="btn-resume">Resume</button>
      <button class="btn btn-secondary" id="btn-restart-from-pause">Restart Room</button>
      <button class="btn btn-secondary" id="btn-menu-from-pause">Main Menu</button>
    </div>
  </section>

  <!-- GAME OVER OVERLAY -->
  <section id="screen-game-over" class="screen overlay">
    <div class="overlay-card overlay-danger">
      <h2>Crushed.</h2>
      <p class="overlay-stat">You survived <span id="game-over-time">0</span>s</p>
      <button class="btn btn-primary" id="btn-retry">Retry</button>
      <button class="btn btn-secondary" id="btn-menu-from-gameover">Main Menu</button>
    </div>
  </section>

  <!-- LEVEL COMPLETE OVERLAY -->
  <section id="screen-level-complete" class="screen overlay">
    <div class="overlay-card overlay-success">
      <h2>Room Cleared</h2>
      <p class="overlay-stat">Time: <span id="complete-time">0</span>s</p>
      <p class="overlay-stat">Streak: <span id="complete-combo">0</span></p>
      <button class="btn btn-primary" id="btn-next-level">Next Room</button>
      <button class="btn btn-secondary" id="btn-menu-from-complete">Main Menu</button>
    </div>
  </section>

</div>

<script src="levels.js"></script>
<script src="puzzles.js"></script>
<script src="game.js"></script>
</body>
</html>
